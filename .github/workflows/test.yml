name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synth:
    name: synth · pytest + lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install synth (editable, with test extras)
        working-directory: ./synth
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Ruff lint (synth)
        working-directory: ./synth
        run: ruff check src tests

      - name: Pytest (synth)
        working-directory: ./synth
        run: pytest -ra --cov=synth --cov-report=term-missing

  detect:
    name: detect · pytest + lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install detect (editable, CPU-only, with test extras)
        working-directory: ./detect
        run: |
          python -m pip install --upgrade pip
          # torch-cpu wheel keeps CI runtime small; no GPU tests here.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test,dev]"

      - name: Ruff lint (detect)
        working-directory: ./detect
        run: ruff check src tests

      - name: Pytest (detect)
        working-directory: ./detect
        run: pytest -ra --cov=detect --cov-report=term-missing

  schema-conformance:
    name: schema · validate demo cohort
    runs-on: ubuntu-latest
    needs: [synth, detect]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install synth
        working-directory: ./synth
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate the checked-in demo fixture cohort
        run: |
          # The demo fixture lives under detect/tests/fixtures/ so that both
          # modules can exercise it; treat it as the canonical schema-check.
          python -m synth.validate detect/tests/fixtures/demo_cohort/
