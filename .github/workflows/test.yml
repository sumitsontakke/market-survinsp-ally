name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synth:
    name: synth - pytest + lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Bumped from v4 (Node 20, deprecated) to v5 (Node 24)
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        # Bumped from v5 (Node 20, deprecated) to v6 (Node 24)
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install synth (editable, with test extras)
        working-directory: ./synth
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      # Ruff findings on migrated code are numerous and cosmetic. Keep the
      # signal (still runs, still reports) but do not gate CI on them until
      # the migrated code gets a formatting pass. Change to `false` (or
      # remove) once the code base is lint-clean.
      - name: Ruff lint (synth)
        continue-on-error: true
        working-directory: ./synth
        run: ruff check src tests

      - name: Pytest (synth)
        working-directory: ./synth
        # Use `python -m pytest` so pytest always runs under the same interpreter
        # that just did `pip install -e`. Bare `pytest` can resolve to a different
        # binary on Windows dev machines and miss the editable installs.
        run: python -m pytest -ra --cov=synth --cov-report=term-missing

  detect:
    name: detect - pytest + lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install detect (editable, CPU-only, with test extras)
        working-directory: ./detect
        run: |
          python -m pip install --upgrade pip
          # torch-cpu wheel keeps CI runtime small; no GPU tests here.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test,dev]"

      - name: Ruff lint (detect)
        continue-on-error: true
        working-directory: ./detect
        run: ruff check src tests

      - name: Pytest (detect)
        working-directory: ./detect
        run: python -m pytest -ra --cov=detect --cov-report=term-missing

  # Schema-conformance job intentionally removed until a fixture cohort
  # exists under detect/tests/fixtures/demo_cohort/. Add it back then;
  # note that hashFiles() only works in step-level `if:`, never job-level.
